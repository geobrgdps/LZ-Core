<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LZ Core V0.3 Beta Test</title>
    <style>
        /* ==========================================================================
           1. VARIÁVEIS DE DESIGN E RESET (FUTURISTA & DARK MODE)
           ========================================================================== */
        :root {
            --bg-base: #0a0a0f;
            --bg-surface: #12121a;
            --bg-panel: #181824;
            --bg-panel-hover: #222233;
            --accent-purple: #8b5cf6;
            --accent-purple-glow: rgba(139, 92, 246, 0.4);
            --accent-cyan: #06b6d4;
            --accent-cyan-glow: rgba(6, 182, 212, 0.3);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2e2e48;
            --danger-color: #ef4444;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "Fira Code", Consolas, Monaco, monospace;
            --header-height: 50px;
            --sidebar-width: 280px;
            --properties-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            user-select: none;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
        }

        /* Scrollbar Personalizado estilo ROBLOX Studio / VS Code */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-purple);
        }

        /* ==========================================================================
           2. SISTEMA DE LOGIN (PIN LOCK)
           ========================================================================== */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1528 0%, var(--bg-base) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 30px var(--accent-purple-glow);
        }

        .login-card h1 {
            font-size: 1.8rem;
            letter-spacing: 3px;
            color: var(--text-main);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .login-card .subtitle {
            font-size: 0.8rem;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .pin-input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .pin-input {
            width: 100%;
            padding: 12px;
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 5px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            border-radius: 6px;
            outline: none;
            font-family: var(--font-mono);
        }

        .pin-input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px var(--accent-purple-glow);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent-purple);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: #7c3aed;
            box-shadow: 0 0 15px var(--accent-purple-glow);
        }

        .login-error {
            color: var(--danger-color);
            font-size: 0.8rem;
            margin-top: 10px;
            height: 15px;
        }

        /* ==========================================================================
           3. LAYOUT PRINCIPAL (HEADER, EXPLORER, WORKSPACE, PROPERTIES)
           ========================================================================== */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            opacity: 1;
        }

        /* Header / Top Navigation */
        header {
            height: var(--header-height);
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 10;
        }

        .brand {
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: var(--accent-purple);
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        .search-bar-container {
            position: relative;
            width: 300px;
        }

        .search-bar {
            width: 100%;
            padding: 6px 12px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--accent-cyan);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* Main Workspace Layout */
        .main-body {
            display: flex;
            flex: 1;
            height: calc(100vh - var(--header-height));
            overflow: hidden;
            position: relative;
        }

        /* Explorer (Left Sidebar) */
        .panel-explorer {
            width: var(--sidebar-width);
            background: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 5;
        }

        .panel-header {
            padding: 10px 15px;
            background: var(--bg-panel);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tree-view {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        /* Item da Árvore de Arquivos (Roblox Studio Explorer Inspired) */
        .tree-item {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text-muted);
            gap: 8px;
            border-left: 2px solid transparent;
            position: relative;
        }

        .tree-item:hover {
            background: var(--bg-panel-hover);
            color: var(--text-main);
        }

        .tree-item.active {
            background: var(--bg-panel-hover);
            color: var(--accent-cyan);
            border-left-color: var(--accent-cyan);
        }

        .tree-item.folder {
            font-weight: 600;
            color: var(--text-main);
        }

        .tree-indent {
            display: inline-block;
            width: 12px;
        }

        /* Workspace (Central Area) */
        .panel-workspace {
            flex: 1;
            background: var(--bg-base);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .workspace-breadcrumbs {
            padding: 8px 15px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .workspace-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        /* Properties (Right Sidebar) */
        .panel-properties {
            width: var(--properties-width);
            background: var(--bg-surface);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .property-grid {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.85rem;
        }

        .property-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .property-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .property-value {
            color: var(--text-main);
            word-break: break-all;
        }

        /* ==========================================================================
           4. VISUAIS DE CORES (CORE DASHBOARD & CARDS)
           ========================================================================== */
        .core-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .core-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .core-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
        }

        .core-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-purple);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .core-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .core-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background: var(--bg-panel);
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--accent-cyan);
            border: 1px solid var(--border-color);
        }

        .core-card-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .core-card-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.3;
            height: 32px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .core-card-footer {
            font-size: 0.7rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
        }

        /* ==========================================================================
           5. EDITOR LZARCHIVEZ & PROTECTED VIEW
           ========================================================================== */
        .editor-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .editor-header {
            padding: 12px 20px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .editor-title-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: bold;
            outline: none;
            padding: 2px 4px;
            width: 250px;
        }

        .editor-title-input:focus {
            border-bottom-color: var(--accent-cyan);
        }

        .editor-toolbar {
            display: flex;
            gap: 8px;
        }

        .editor-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            overflow-y: auto;
        }

        .editor-meta-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .editor-select {
            background: var(--bg-base);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 4px;
            outline: none;
            font-size: 0.85rem;
        }

        .editor-content {
            flex: 1;
            min-height: 250px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .editor-content:focus {
            border-color: var(--accent-purple);
        }

        .editor-image-preview {
            max-height: 150px;
            max-width: 100%;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-base);
        }

        /* Visão de Arquivo Fechado/Protegido */
        .protected-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 15px;
            background: var(--bg-surface);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 40px;
        }

        .protected-icon {
            font-size: 3rem;
            color: var(--accent-purple);
        }

        /* ==========================================================================
           6. COMPONENTES DE UI & BOTÕES
           ========================================================================== */
        .btn {
            background: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--bg-panel-hover);
            border-color: var(--accent-cyan);
        }

        .btn-primary {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
        }

        .btn-primary:hover {
            background: #7c3aed;
            border-color: #7c3aed;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: var(--danger-color);
            color: white;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
        }

        /* Modal Generico */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-body {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 400px;
            max-width: 90vw;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-input {
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-cyan);
        }

        /* Navbar Mobile Bottom */
        .mobile-nav {
            display: none;
            height: 50px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .mobile-nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }

        .mobile-nav-btn.active {
            color: var(--accent-cyan);
        }

        /* ==========================================================================
           7. ADAPTAÇÃO RESPONSIVA (MOBILE)
           ========================================================================== */

            .panel-explorer, .panel-properties {
                posi
